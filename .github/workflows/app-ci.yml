name: App validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Go quality and dependency safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            functions/go.sum
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.59.0'
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Check both modules
        run: just fmt-check lint tidy-check modernize-check vuln

  tests:
    name: Build, tests, race, and fuzz
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            functions/go.sum
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.59.0'

      - name: Build both modules
        run: just build

      - name: Test root module with coverage
        run: just test-coverage

      - name: Generate coverage reports
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: |
          go tool cover -func=coverage.out > coverage-summary.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo '### Test coverage'
            echo
            sed 's/^/    /' coverage-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test Functions
        run: just test-functions

      - name: Smoke-test Functions Framework target
        run: just functions-smoke

      - name: Race detector
        run: just test-race

      - name: Fuzz high-risk parsers
        run: just fuzz

      - name: Upload coverage artifacts
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            coverage-summary.txt
          if-no-files-found: error

  firebase-emulators:
    name: Firebase emulator integration tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /dev/null
      GCE_METADATA_HOST: '127.0.0.1:9'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            functions/go.sum
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.59.0'

      - name: Set up Java for emulators
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Node.js for Firebase CLI
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'

      - name: Run required emulator tests
        run: just test-integration-ci

      - name: Generate emulator coverage reports
        if: ${{ !cancelled() && hashFiles('integration-coverage.out') != '' }}
        run: |
          go tool cover -func=integration-coverage.out > integration-coverage-summary.txt
          go tool cover -html=integration-coverage.out -o integration-coverage.html
          {
            echo '### Emulator-backed test coverage'
            echo
            sed 's/^/    /' integration-coverage-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator coverage artifacts
        if: ${{ !cancelled() && hashFiles('integration-coverage.out') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: emulator-coverage-report
          path: |
            integration-coverage.out
            integration-coverage.html
            integration-coverage-summary.txt
          if-no-files-found: error

  container:
    name: Container build and smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.59.0'

      - name: Probe final image
        run: just container-smoke

  actionlint:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.7.1
        env:
          ZIZMOR_OFFLINE: 'true'
        with:
          version: '1.31.1'
          persona: pedantic
          online-audits: false
          advanced-security: false

  ci:
    name: ci
    if: ${{ always() }}
    needs: [quality, tests, firebase-emulators, container, actionlint, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          FIREBASE_EMULATORS: ${{ needs['firebase-emulators'].result }}
          CONTAINER: ${{ needs.container.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$FIREBASE_EMULATORS" = success
          test "$CONTAINER" = success
          test "$ACTIONLINT" = success
          test "$ZIZMOR" = success
