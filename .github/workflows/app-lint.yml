name: App code quality (linting and formatting)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            functions/go.sum
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.59.0'
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Check formatting and lint rules in both modules
        run: just fmt-check lint

  legacy-lint:
    name: Require code quality
    if: ${{ always() }}
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require lint
        env:
          RESULT: ${{ needs.lint.result }}
        run: test "$RESULT" = success
